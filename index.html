<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Menu Example</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
    <div class="container">
        <div class="logo">Santacruz Brewery</div>

        <nav class="menu">
            <a href="#">Our Beers</a>
            <a href="#">Stories</a>
            <a href="#">About Us</a>
            <a href="#">Locations</a>
            <a href="#">Shop</a>
        </nav>
    </div>
</header>

<section class="hero"></section>
<section class="featured">

    <div class="featured-header">
        <span>FEATURED</span>
        <h2>The Goods</h2>
    </div>

    <div class="products">

        <div class="product">
            <img src="https://www.firestonewalker.com/wp-content/uploads/2020/07/DBA-bottle.png">
        </div>

        <div class="product">
            <img src="https://www.firestonewalker.com/wp-content/uploads/2020/07/UnionJack-Can.png">
        </div>

        <div class="product">
            <img src="https://www.firestonewalker.com/wp-content/uploads/2020/07/Pivo-Pils-Can.png">
        </div>

    </div>

</section>

</body>
</html>
