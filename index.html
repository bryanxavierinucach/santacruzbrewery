<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Menu Example</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
<script>
window.addEventListener('scroll', function() {
    const header = document.querySelector('.header');
    const hero = document.querySelector('.hero');
    const scrollY = window.scrollY;
    const heroHeight = hero.offsetHeight;
    
    // Calculate opacity based on scroll position
    const opacity = 1 - (scrollY / heroHeight);
    hero.style.opacity = Math.max(0, opacity);
    
    // Add scrolled class to header when past hero
    if (scrollY > 50) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
});

// Mobile menu toggle
document.addEventListener('DOMContentLoaded', function(){
    const menuToggle = document.querySelector('.menu-toggle');
    const menu = document.querySelector('.menu');
    
    if(menuToggle && menu){
        menuToggle.addEventListener('click', function(){
            menu.classList.toggle('active');
            menuToggle.classList.toggle('active');
        });
    }
});
</script>

<body>

<header class="header">
    <div class="container">
        <div class="logo">Santacruz Brewery</div>

        <nav class="menu">
            <a href="#">Our Beers</a>
            <a href="#">Stories</a>
            <a href="#">About Us</a>
            <a href="#">Locations</a>
            <a href="#">Shop</a>
        </nav>

        <button class="menu-toggle" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>

<section class="hero"></section>
<section class="featured">

    <div class="featured-header">
        <span>LOS PRODUCTOS</span>
        <h2>Destacados</h2>
    </div>

    <ul class="products-list js-products-list">

        <li class="products-item has-glass js-products-item js-shelf-item">
            <a class="products-item-link" href="https://www.firestonewalker.com/beer/dba/">
                <figure class="products-item-art products-item-art--bottle">
                    <img class="products-item-art-image" src="https://www.firestonewalker.com/wp-content/uploads/2025/12/FW_DBA_PDP_Render_Working.png" lazy="loading" alt="DBA">

                    <picture class="products-item-art-glass">
                        <img class="products-item-art-glass-image" src="https://www.firestonewalker.com/wp-content/uploads/2020/04/DBA_beer-glass-pdp-render-4.png" lazy="loading" alt="">
                    </picture>
                </figure>
            </a>
        </li>

        <li class="products-item has-glass js-products-item js-shelf-item">
            <a class="products-item-link" href="https://www.firestonewalker.com/beer/union-jack/">
                <figure class="products-item-art products-item-art--can">
                    <img class="products-item-art-image" src="https://www.firestonewalker.com/wp-content/uploads/2025/12/FW_Union_Jack_PDP-Renders.png" lazy="loading" alt="Union Jack">

                    <picture class="products-item-art-glass">
                        <img class="products-item-art-glass-image" src="https://www.firestonewalker.com/wp-content/uploads/2025/02/8ZERO5_beer-glass-pdp-render.png" lazy="loading" alt="">
                    </picture>
                </figure>
            </a>
        </li>

        <li class="products-item has-glass js-products-item js-shelf-item">
            <a class="products-item-link" href="https://www.firestonewalker.com/beer/pivo/">
                <figure class="products-item-art products-item-art--can">
                    <img class="products-item-art-image" src="https://www.firestonewalker.com/wp-content/uploads/2025/12/FW_Pivo_PDP-Renders.png" lazy="loading" alt="Pivo">

                    <picture class="products-item-art-glass">
                        <img class="products-item-art-glass-image" src="https://www.firestonewalker.com/wp-content/uploads/2022/09/Cal-Poly_beer-glass-pdp-render.png" lazy="loading" alt="">
                    </picture>
                </figure>
            </a>
        </li>

    </ul>

    <button class="carousel-arrow carousel-arrow--prev" aria-label="Previous">&#8249;</button>
    <button class="carousel-arrow carousel-arrow--next" aria-label="Next">&#8250;</button>

</section>

<section class="hero-art">
    <div class="hero-art-image hero-art-image--68825"></div>
</section>

<script>
// Carousel functionality for mobile with swipe support
document.addEventListener('DOMContentLoaded', function(){
    const products = document.querySelectorAll('.products-item');
    const prevBtn = document.querySelector('.carousel-arrow--prev');
    const nextBtn = document.querySelector('.carousel-arrow--next');
    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;
    
    function showProduct(index){
        products.forEach((product, i) => {
            product.classList.remove('active');
            if(i === index){
                product.classList.add('active');
            }
        });
    }
    
    // Only initialize carousel on mobile
    if(window.innerWidth <= 768 && products.length > 0){
        showProduct(currentIndex);
        
        // Button navigation
        prevBtn.addEventListener('click', function(){
            currentIndex = (currentIndex - 1 + products.length) % products.length;
            showProduct(currentIndex);
        });
        
        nextBtn.addEventListener('click', function(){
            currentIndex = (currentIndex + 1) % products.length;
            showProduct(currentIndex);
        });
        
        // Touch swipe navigation
        const carousel = document.querySelector('.products-list');
        
        carousel.addEventListener('touchstart', function(e){
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});
        
        carousel.addEventListener('touchend', function(e){
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});
        
        function handleSwipe(){
            if(touchEndX < touchStartX - 50){
                // Swipe left - next product
                currentIndex = (currentIndex + 1) % products.length;
                showProduct(currentIndex);
            }
            if(touchEndX > touchStartX + 50){
                // Swipe right - previous product
                currentIndex = (currentIndex - 1 + products.length) % products.length;
                showProduct(currentIndex);
            }
        }
    }
});
</script>

</body>
</html>
